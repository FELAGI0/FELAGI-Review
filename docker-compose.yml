name: felagi-review

services:
  felagi-db:
    image: pgvector/pgvector:pg16
    container_name: felagi-db
    environment:
      POSTGRES_USER: felagi
      POSTGRES_PASSWORD: felagi
      POSTGRES_DB: felagi_review
    ports:
      - "55432:5432"
    volumes:
      - felagi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felagi"]
      interval: 5s
      timeout: 5s
      retries: 10

  felagi-redis:
    image: redis:7-alpine
    container_name: felagi-redis
    ports:
      - "6380:6379"
    volumes:
      - felagi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  felagi-backend:
    build: ./backend
    container_name: felagi-backend
    env_file:
      - .env
    environment:
      FELAGI_APP_ENV: ${FELAGI_APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://felagi:felagi@felagi-db:5432/felagi_review
      REDIS_URL: redis://felagi-redis:6379/0
    depends_on:
      felagi-db:
        condition: service_healthy
      felagi-redis:
        condition: service_healthy
    ports:
      - "8080:8000"

  felagi-frontend:
    build: ./frontend
    container_name: felagi-frontend
    ports:
      - "5174:80"
    depends_on:
      - felagi-backend

volumes:
  felagi_pg_data:
  felagi_redis_data:
